<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roster · 12-hour shift planner</title>
<meta name="description" content="Plan, solve and export 12-hour nursing rosters for two wards.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Roster">
<meta name="theme-color" content="#f7f9fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0d14" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Palette dealt by tasteskill: cool-white-slate (light) / blue-black-cornflower (dark); type: IBM Plex (Latin + Arabic). */
:root{
  --bg:#f7f9fa; --surface:#ecf0f2; --card:#ffffff; --ink:#1f3038; --ink-2:#4a5c64; --muted:#5d6e76; --line:#dbe2e6; --line-2:#c9d3d8;
  --accent:#0d7480; --accent-ink:#ffffff; --accent-soft:#e1f0f1;
  --d-bg:#fbe7bd; --d-ink:#6a4200; --d-edge:#e9c77d;
  --n-bg:#d3e1f6; --n-ink:#18396b; --n-edge:#9fbbe3;
  --l-bg:#d9eedb; --l-ink:#245a2b;
  --r-ink:#5d6e76;
  --we:#eef2f4;
  --err:#b42318; --err-bg:#fdecea; --warn:#8a5300; --warn-bg:#fff4e0; --ok:#1d6b3a; --ok-bg:#e3f3e8;
  --ot:#c2410c;
  --shadow:0 1px 2px rgba(16,32,40,.06),0 4px 16px rgba(16,32,40,.06);
  --r-sm:8px; --r:12px; --r-lg:18px;
  --ease:cubic-bezier(.2,.8,.2,1); --m-in:150ms; --m-out:120ms; --m-press:90ms; --m-panel:200ms;
  --font:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0a0d14; --surface:#131824; --card:#111622; --ink:#e9edf3; --ink-2:#c3cad6; --muted:#97a1b1; --line:#222a3a; --line-2:#2e3749;
  --accent:#5ab9fc; --accent-ink:#06121f; --accent-soft:#12283b;
  --d-bg:#3d2f0f; --d-ink:#f6d78e; --d-edge:#6b5420;
  --n-bg:#152a4c; --n-ink:#aecbff; --n-edge:#2b4a7d;
  --l-bg:#17321f; --l-ink:#a9dcb0;
  --r-ink:#97a1b1;
  --we:#0e131d;
  --err:#ff8f86; --err-bg:#3a1714; --warn:#ffc46b; --warn-bg:#33240b; --ok:#86d9a0; --ok-bg:#12291b;
  --ot:#ff9a6b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.skip{position:absolute;inset-inline-start:-999px;top:8px}
.skip:focus{inset-inline-start:8px;z-index:50;background:var(--card);padding:8px 12px;border-radius:var(--r-sm)}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top-in{max-width:1480px;margin:0 auto;padding:10px calc(16px + env(safe-area-inset-right)) 10px calc(16px + env(safe-area-inset-left));display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:600;font-size:12px;letter-spacing:-.02em;flex:none}
.brand b{font-weight:600;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.month{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;height:40px;flex:none}
.month b{min-width:112px;text-align:center;font-weight:500;font-size:14px}
.icon-btn{width:40px;height:40px;border:0;background:transparent;border-radius:999px;display:grid;place-items:center;color:var(--ink-2);flex:none;transition:background var(--m-out) var(--ease),transform var(--m-press) var(--ease)}
.icon-btn:hover{background:var(--surface);transition-duration:var(--m-in)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:20px;height:20px}
[dir=rtl] .flip svg{transform:scaleX(-1)}
.lang-btn{font-weight:600;font-size:14px;color:var(--ink)}

.wrap{max-width:1480px;margin:0 auto;padding:16px calc(16px + env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
.tabs{display:flex;gap:4px;background:var(--surface);padding:4px;border-radius:999px;margin-bottom:16px;width:max-content;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;border-radius:999px;height:36px;padding:0 16px;font-weight:500;font-size:14px;color:var(--ink-2);white-space:nowrap;display:flex;align-items:center;gap:6px;transition:background var(--m-out) var(--ease),color var(--m-out) var(--ease)}
.tab[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.dot{min-width:18px;height:18px;padding:0 5px;border-radius:9px;font-size:11px;font-weight:600;display:inline-grid;place-items:center;background:var(--err);color:#fff}
.dot.ok{background:var(--ok);color:var(--bg)}

/* ---------- surfaces ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;border-bottom:1px solid var(--line)}
.grow{flex:1}
.pill{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px 0 10px;border:1px solid var(--line);background:var(--bg);border-radius:999px;font-weight:500;font-size:14px;transition:border-color var(--m-out) var(--ease),transform var(--m-press) var(--ease)}
.pill:hover{border-color:var(--line-2);transition-duration:var(--m-in)}
.pill:active{transform:scale(.98)}
.pill .no{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:12px;font-weight:600}
.pill small{color:var(--muted);font-weight:400}
.pill svg{width:16px;height:16px;color:var(--muted)}
.stepper{display:flex;align-items:center;height:44px;border:1px solid var(--line);border-radius:999px;background:var(--bg)}
.stepper span{font-size:13px;color:var(--ink-2);padding:0 4px;min-width:62px;text-align:center}
.btn{text-decoration:none;height:44px;padding:0 18px;border-radius:999px;border:1px solid transparent;font-weight:500;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background var(--m-out) var(--ease),transform var(--m-press) var(--ease),box-shadow var(--m-out) var(--ease)}
.btn svg{width:18px;height:18px}
.btn--primary{background:var(--accent);color:var(--accent-ink)}
.btn--primary:hover{box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 35%,transparent);transform:translateY(-1px);transition-duration:var(--m-in)}
.btn--secondary{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn--secondary:hover{background:color-mix(in srgb,var(--surface) 70%,var(--line));transition-duration:var(--m-in)}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;pointer-events:none}
.status{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:10px 14px;font-size:13.5px;color:var(--ink-2);border-bottom:1px solid var(--line)}
.status .s{display:flex;align-items:center;gap:6px}
.status svg{width:16px;height:16px}
.s.ok{color:var(--ok)} .s.err{color:var(--err)} .s.warn{color:var(--warn)}
.banner{margin:12px;padding:12px 14px;border-radius:var(--r);background:var(--accent-soft);color:var(--ink);font-size:13.5px;display:flex;gap:10px;align-items:center}

/* ---------- grid ---------- */
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
table.grid{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
.grid th,.grid td{padding:0;text-align:center;border-bottom:1px solid var(--line)}
.grid thead th{position:sticky;top:0;background:var(--card);z-index:2;height:44px;font-weight:500}
.grid th.dh{min-width:34px;width:34px;line-height:1.1;font-size:12.5px}
.grid th.dh small{display:block;font-weight:400;color:var(--muted);font-size:10.5px}
.grid .we{background:var(--we)}
.grid thead th.we{background:var(--we)}
.grid th.today span{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink)}
.nm{position:sticky;inset-inline-start:0;z-index:3;background:var(--card);text-align:start!important;padding-inline:14px 10px!important;min-width:132px;max-width:132px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-inline-end:1px solid var(--line);height:42px}
thead .nm{z-index:4;color:var(--muted);font-size:12px}
.nm .g{color:var(--muted);font-size:11px;margin-inline-start:6px}
.team td{background:var(--surface);height:30px;font-size:12px;color:var(--ink-2);font-weight:500}
.team td.nm{background:var(--surface);height:30px}
td.c{min-width:34px;width:34px;height:42px;position:relative;cursor:pointer;user-select:none;-webkit-user-select:none}
td.c span{display:flex;align-items:center;justify-content:center;width:28px;height:30px;margin:auto;border-radius:7px;font-weight:600;font-size:12px;transition:transform var(--m-press) var(--ease)}
td.c:active span{transform:scale(.92)}
.s-D span{background:var(--d-bg);color:var(--d-ink)}
.s-N span{background:var(--n-bg);color:var(--n-ink)}
.s-AL span{background:var(--l-bg);color:var(--l-ink);font-size:11px}
.s-R span{color:var(--r-ink);background:repeating-linear-gradient(135deg,transparent 0 4px,var(--line) 4px 5px);font-size:11px}
.s-O span{color:transparent}
.ot span{box-shadow:inset 0 0 0 2px var(--ot)}
.x span{outline:2px dashed var(--accent);outline-offset:-2px}
.lk::after{content:"";position:absolute;top:5px;inset-inline-end:4px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.st{min-width:46px;padding:0 6px!important;font-size:12.5px;color:var(--ink-2)}
.st.h{font-weight:600;color:var(--ink)}
.pos{color:var(--muted)} .big{color:var(--ot);font-weight:600} .neg{color:var(--err);font-weight:600}
.grid tfoot td{height:34px;font-size:12px;font-weight:500;color:var(--ink-2);background:var(--bg)}
.grid tfoot td.nm{background:var(--bg);font-weight:500}
.grid tfoot td.low{color:var(--err);font-weight:700;background:var(--err-bg)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;padding:12px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:18px;height:14px;border-radius:4px}

/* ---------- day view ---------- */
.strip{display:flex;gap:6px;overflow-x:auto;padding:12px;scrollbar-width:none;border-bottom:1px solid var(--line)}
.strip::-webkit-scrollbar{display:none}
.chip{flex:none;width:48px;height:60px;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--muted);line-height:1.2;transition:transform var(--m-press) var(--ease)}
.chip b{font-size:17px;color:var(--ink);font-weight:500}
.chip.we{background:var(--we)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed=true] b{color:var(--accent-ink)}
.chip:active{transform:scale(.96)}
.daygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;padding:16px}
.daygrid h3{margin:0 0 10px;font-size:15px;font-weight:600}
.duty{border-radius:var(--r);padding:12px 14px;margin-bottom:10px;border:1px solid}
.duty.D{background:var(--d-bg);color:var(--d-ink);border-color:var(--d-edge)}
.duty.N{background:var(--n-bg);color:var(--n-ink);border-color:var(--n-edge)}
.duty header{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:6px}
.duty ul{margin:0;padding-inline-start:18px}
.duty li{margin:3px 0;font-size:14.5px}
.duty .empty{font-weight:600;color:var(--err)}

/* ---------- checks ---------- */
.list{list-style:none;margin:0;padding:8px 12px 12px}
.list li{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:var(--r);margin:4px 0;font-size:14px}
.list li.error{background:var(--err-bg);color:var(--err)}
.list li.warn{background:var(--warn-bg);color:var(--warn)}
.list li.info{background:var(--surface);color:var(--ink-2)}
.list em{font-style:normal;font-weight:600;min-width:56px;font-size:13px}
.sect{padding:14px 16px 4px;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.okline{margin:6px 12px 12px;padding:12px 14px;border-radius:var(--r);background:var(--ok-bg);color:var(--ok);font-size:14px;display:flex;gap:8px;align-items:center}
.okline svg{width:18px;height:18px;flex:none}

/* ---------- settings ---------- */
.form{padding:4px 16px 16px}
.field{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field label,.field .lbl{font-size:14px;color:var(--ink-2)}
.field input[type=text]{width:100%;min-width:0;height:44px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg);padding:0 12px;font-size:16px}
.field.stack{grid-template-columns:1fr}
.seg{display:inline-flex;background:var(--surface);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;height:38px;padding:0 14px;border-radius:999px;font-size:13.5px;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.count{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--bg)}
.count b{min-width:44px;text-align:center;font-weight:500}
.nurse{display:grid;grid-template-columns:44px 1fr 86px auto 44px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.nurse input[type=text]{width:100%;height:44px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg);padding:0 10px;font-size:16px}
.nurse select{height:44px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg);padding:0 6px;font-size:16px}
.check{width:44px;height:44px;display:grid;place-items:center}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.danger{color:var(--err)}

/* ---------- bottom bar ---------- */
.dock{position:fixed;inset-inline:0;bottom:0;z-index:15;padding:10px calc(16px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.dock-in{max-width:1480px;margin:0 auto;display:flex;gap:10px}
.dock .btn{flex:1;height:48px;font-size:15px}
@media (min-width:760px){.dock .btn{flex:none;min-width:200px}.dock-in{justify-content:flex-end}}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(8,14,20,.38);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity var(--m-panel) var(--ease)}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(24px);transition:transform var(--m-panel) var(--ease);box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.scrim.open .sheet{transform:none}
@media (min-width:760px){.scrim{align-items:center}.sheet{border-radius:22px;padding-bottom:22px}}
.sheet{position:relative}
.sheet-x{position:absolute;top:12px;inset-inline-end:12px;font-size:16px;color:var(--muted)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line-2);margin:4px auto 12px}
.sheet h2{margin:0;font-size:19px;font-weight:600;letter-spacing:-.01em}
.sheet p.sub{margin:4px 0 16px;color:var(--muted);font-size:13.5px}
.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.choices button{height:56px;border-radius:var(--r);border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:14px;transition:transform var(--m-press) var(--ease)}
.choices button:active{transform:scale(.97)}
.choices .cD{background:var(--d-bg);color:var(--d-ink);border-color:var(--d-edge)}
.choices .cN{background:var(--n-bg);color:var(--n-ink);border-color:var(--n-edge)}
.choices .cAL{background:var(--l-bg);color:var(--l-ink)}
.choices .cR{background:repeating-linear-gradient(135deg,var(--bg) 0 6px,var(--surface) 6px 8px)}
.choices button[aria-pressed=true]{outline:2px solid var(--accent);outline-offset:2px}
.row-end{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:start;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--bg);margin-bottom:8px;transition:border-color var(--m-out) var(--ease),transform var(--m-press) var(--ease)}
.opt:hover{border-color:var(--line-2);transition-duration:var(--m-in)}
.opt:active{transform:scale(.99)}
.opt[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.opt .ic{width:40px;height:40px;border-radius:12px;background:var(--surface);display:grid;place-items:center;flex:none;color:var(--accent)}
.opt .ic svg{width:20px;height:20px}
.opt b{display:block;font-weight:600;font-size:15px}
.opt span{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.pcard{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:start;width:100%;text-align:start;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--bg);margin-bottom:8px;transition:border-color var(--m-out) var(--ease),transform var(--m-press) var(--ease)}
.pcard:active{transform:scale(.99)}
.pcard[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pcard .no{width:30px;height:30px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:600;font-size:13px}
.pcard[aria-pressed=true] .no{background:var(--accent);color:var(--accent-ink)}
.pcard b{font-weight:600;font-size:15px}
.pcard .meta{grid-column:2/4;color:var(--muted);font-size:13px}
.pcard .big{font-size:20px;font-weight:600;color:var(--ink);text-align:end;line-height:1.1}
.pcard .big small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.bar{display:flex;gap:4px;margin-top:8px;grid-column:2/4}
.bar i{height:8px;flex:1;border-radius:2px;background:var(--surface)}
.bar i.on{background:var(--n-edge)}
.pfoot{grid-column:2/4;font-size:12.5px;display:flex;gap:10px;margin-top:4px}
.preview{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);margin:4px 0 14px;aspect-ratio:297/210;display:grid;place-items:center}
.preview img,.preview canvas{width:100%;height:100%;object-fit:contain;display:block}
.msg{white-space:pre-wrap;font-size:13.5px;background:var(--surface);border-radius:var(--r);padding:12px 14px;margin:4px 0 14px;max-height:240px;overflow:auto;line-height:1.6}
.opts{display:grid;gap:12px;margin-bottom:6px}
.opts .lbl{font-size:12.5px;color:var(--muted);margin-bottom:6px;display:block}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,8px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13.5px;opacity:0;transition:opacity var(--m-panel) var(--ease),transform var(--m-panel) var(--ease);pointer-events:none;z-index:60;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:88px;padding:12px 6px;border-radius:var(--r);border:1px solid var(--line);background:var(--bg);font-weight:500;font-size:13.5px;text-align:center;transition:border-color var(--m-out) var(--ease),transform var(--m-press) var(--ease)}
.tile svg{width:22px;height:22px;color:var(--accent)}
.tile:active{transform:scale(.98)}
.tile[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--accent-soft)}
@media (max-width:560px){
  .brand > span:last-child{display:none}

  .month b{min-width:104px}
  .pill small{display:none}
  .toolbar{flex-wrap:nowrap}
  .stepper span{min-width:44px}
}

<script>
// ===== Roster engine (12h, fixed Day/Night teams) =====
const Engine = (() => {
  const WORK = s => s === 'D' || s === 'N';

  function rng(seed) {
    let a = (seed >>> 0) + 0x9e3779b9;
    return () => {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const daysIn = (y, m) => new Date(y, m + 1, 0).getDate();
  const dow = (y, m, d) => new Date(y, m, d + 1).getDay(); // d is 0-based
  const isWeekend = (y, m, d) => { const w = dow(y, m, d); return w === 5 || w === 6; };

  function targetFor(nurse, cfg, wardLocks, days) {
    const L = (wardLocks && wardLocks[nurse.id]) || {};
    let al = 0;
    for (let d = 0; d < days; d++) if (L[d] === 'AL') al++;
    const reqHours = Math.max(0, cfg.targetHours - al * cfg.alCredit);
    return { al, reqHours, shifts: Math.ceil(reqHours / cfg.shiftLen) };
  }

  function generateWard(ward, cfg, wardLocks, seed) {
    if (cfg.block) return patternWard(ward, cfg, wardLocks, seed);
    const R = rng(seed * 7919 + (ward.key === 'men' ? 1 : 2));
    const days = daysIn(cfg.year, cfg.month);
    const nurses = ward.nurses.filter(n => n.on);
    const mc = cfg.maxConsec, bp = cfg.blockPref;
    const minOf = { D: ward.minD, N: ward.minN };
    const hasCN = nurses.some(n => /CN/.test(n.grade || ''));
    const grid = {}, rem = {}, ot = {}, wk = {}, cb = {};

    nurses.forEach(n => {
      const L = (wardLocks && wardLocks[n.id]) || {};
      grid[n.id] = Array.from({ length: days }, (_, d) =>
        L[d] ? { s: L[d], lock: true } : { s: 'O' });
      const t = targetFor(n, cfg, wardLocks, days);
      const lockedWork = grid[n.id].filter(c => c.lock && WORK(c.s)).length;
      rem[n.id] = Math.max(0, t.shifts - lockedWork);
      ot[n.id] = 0; cb[n.id] = 0;
      wk[n.id] = grid[n.id].filter((c, d) => WORK(c.s) && isWeekend(cfg.year, cfg.month, d)).length;
    });

    const cell = (id, d) => (d < 0 || d >= days) ? { s: 'O' } : grid[id][d];
    const count = (d, T) => nurses.filter(n => grid[n.id][d].s === T).length;
    const cnOn = (d, T) => nurses.some(n => grid[n.id][d].s === T && /CN/.test(n.grade || ''));

    function canWork(id, d, T) {
      const c = grid[id][d];
      if (c.lock || c.s !== 'O') return false;
      if (T === 'D' && cell(id, d - 1).s === 'N') return false;
      if (T === 'N' && cell(id, d + 1).s === 'D') return false;
      let back = 0; for (let k = d - 1; k >= 0 && WORK(grid[id][k].s); k--) back++;
      let fwd = 0; for (let k = d + 1; k < days && WORK(grid[id][k].s); k++) fwd++;
      return back + fwd + 1 <= mc;
    }
    function freeLeft(id, d) { let f = 0; for (let k = d; k < days; k++) if (!grid[id][k].lock && grid[id][k].s === 'O') f++; return f; }
    function streakBefore(id, d) { let b = 0; for (let k = d - 1; k >= 0 && WORK(grid[id][k].s); k--) b++; return b; }

    // desired per day per team: min + evenly-spread surplus
    const desired = { D: [], N: [] };
    const bal = {};
    ['D', 'N'].forEach(T => {
      const team = nurses.filter(n => n.team === T);
      let need = 0;
      for (let d = 0; d < days; d++) need += Math.max(0, minOf[T] - count(d, T));
      bal[T] = team.reduce((a, n) => a + rem[n.id], 0) - need;
    });
    ['D', 'N'].forEach(T => {
      const team = nurses.filter(n => n.team === T);
      const O = T === 'D' ? 'N' : 'D';
      // cross-cover mode: keep spare shifts in reserve for the other team's shortfall
      let reserve = cfg.gapFill === 'cross' ? Math.min(Math.max(0, bal[T]), Math.max(0, -bal[O])) : 0;
      const E = Math.max(0, bal[T] - reserve);
      const order = team.slice().sort((a, b) => (rem[b.id] - rem[a.id]) || (R() - 0.5));
      for (let i = 0; reserve > 0 && order.length; i = (i + 1) % order.length) {
        const n = order[i]; if (rem[n.id] > 0) { rem[n.id]--; cb[n.id]++; reserve--; }
      }
      const phase = R();
      for (let d = 0; d < days; d++) {
        const ex = Math.floor((d + 1 + phase) * E / days) - Math.floor((d + phase) * E / days);
        desired[T][d] = Math.min(team.length, minOf[T] + ex);
      }
    });

    const avgWk = () => { const v = nurses.map(n => wk[n.id]); return v.reduce((a, b) => a + b, 0) / (v.length || 1); };

    function assign(id, d, T, flags = {}) {
      grid[id][d] = Object.assign({ s: T }, flags);
      if (isWeekend(cfg.year, cfg.month, d)) wk[id]++;
    }

    for (let d = 0; d < days; d++) {
      const we = isWeekend(cfg.year, cfg.month, d);
      for (const T of ['D', 'N']) {
        const team = nurses.filter(n => n.team === T);
        const mcCap = mc / (mc + 1);
        while (true) {
          const c = count(d, T);
          const cands = team.filter(n => rem[n.id] > 0 && canWork(n.id, d, T));
          if (!cands.length) break;
          const needCN = hasCN && !cnOn(d, T);
          let best = null, bestScore = -1e9, anyForced = false;
          const aw = avgWk();
          for (const n of cands) {
            const fl = freeLeft(n.id, d);
            const urg = rem[n.id] / Math.max(0.5, fl * mcCap);
            const forced = urg >= 1;
            if (forced) anyForced = true;
            const st = streakBefore(n.id, d);
            let s = urg * 2;
            if (forced) s += 10;
            if (st > 0 && st < bp) s += 0.6;
            if (st >= bp) s -= 0.5;
            if (st === 0 && d >= 2 && WORK(cell(n.id, d - 2).s)) s -= 0.35; // avoid single day off
            if (we) s -= 0.3 * (wk[n.id] - aw);
            if (needCN && /CN/.test(n.grade || '')) s += (desired[T][d] - c <= 1 ? 4 : 1.2);
            s += R() * 0.4;
            if (s > bestScore) { bestScore = s; best = n; }
          }
          if (c >= desired[T][d] && !(anyForced && bestScore >= 10)) break;
          assign(best.id, d, T);
          rem[best.id]--;
        }
        // gap fill
        while (count(d, T) < minOf[T]) {
          const other = nurses.filter(n => n.team !== T);
          const pools = cfg.gapFill === 'cross'
            ? [[other, false], [team, true], [other, true]]
            : [[team, true], [other, false], [other, true]];
          let done = false;
          const cc = other.filter(n => cb[n.id] > 0 && canWork(n.id, d, T));
          if (cc.length) {
            cc.sort((a, b) => (cb[b.id] - cb[a.id]) || (R() - 0.5));
            assign(cc[0].id, d, T, { x: true }); cb[cc[0].id]--; continue;
          }
          for (const [pool, isOT] of pools) {
            const c2 = pool.filter(n => (isOT ? rem[n.id] === 0 : rem[n.id] > 0) && canWork(n.id, d, T));
            if (!c2.length) continue;
            c2.sort((a, b) => (ot[a.id] - ot[b.id]) || (streakBefore(a.id, d) - streakBefore(b.id, d)) || (R() - 0.5));
            const n = c2[0];
            assign(n.id, d, T, { ot: isOT, x: n.team !== T });
            if (isOT) ot[n.id]++; else rem[n.id]--;
            done = true; break;
          }
          if (!done) break;
        }
      }
    }

    // post-pass: place any leftover shifts on lightest days
    nurses.forEach(n => { rem[n.id] += cb[n.id]; cb[n.id] = 0; });
    nurses.forEach(n => {
      let guard = 0;
      while (rem[n.id] > 0 && guard++ < 60) {
        const opts = [];
        for (let d = 0; d < days; d++) if (canWork(n.id, d, n.team)) opts.push(d);
        if (!opts.length) break;
        opts.sort((a, b) => (count(a, n.team) - count(b, n.team)) || (R() - 0.5));
        assign(n.id, opts[0], n.team);
        rem[n.id]--;
      }
    });

    return grid;
  }


  // ===== Block-pattern generator: B on / ~B off, staggered across the team =====
  function patternWard(ward, cfg, wardLocks, seed) {
    const R = rng(seed * 104729 + (ward.key === 'men' ? 11 : 22));
    const days = daysIn(cfg.year, cfg.month);
    const nurses = ward.nurses.filter(n => n.on);
    const B = cfg.block, mc = cfg.maxConsec, minOff = cfg.minOff || 2;
    const minOf = { D: ward.minD, N: ward.minN };
    const hasCN = nurses.some(n => /CN/.test(n.grade || ''));
    const grid = {}, tgt = {}, ot = {};
    nurses.forEach(n => {
      const L = (wardLocks && wardLocks[n.id]) || {};
      grid[n.id] = Array.from({ length: days }, (_, d) => L[d] ? { s: L[d], lock: true } : { s: 'O' });
      tgt[n.id] = targetFor(n, cfg, wardLocks, days).shifts; ot[n.id] = 0;
    });
    const W = (id, d) => d >= 0 && d < days && WORK(grid[id][d].s);
    const count = (d, T) => nurses.filter(n => grid[n.id][d].s === T).length;
    const shifts = id => grid[id].filter(c => WORK(c.s)).length;
    const runAt = (id, d) => { let b = 0, f = 0; for (let k = d - 1; k >= 0 && W(id, k); k--) b++; for (let k = d + 1; k < days && W(id, k); k++) f++; return b + f + 1; };
    const offLen = (id, d, dir) => { let o = 0; for (let k = d + dir; k >= 0 && k < days && !W(id, k); k += dir) o++; return o; };
    const restOK = (id, d, T) => !(T === 'D' && d > 0 && grid[id][d - 1].s === 'N') && !(T === 'N' && d + 1 < days && grid[id][d + 1].s === 'D');
    const canAdd = (id, d, T, lim) => !grid[id][d].lock && grid[id][d].s === 'O' && runAt(id, d) <= lim && restOK(id, d, T);

    ['D', 'N'].forEach(T => {
      const team = nurses.filter(n => n.team === T);
      if (!team.length) return;
      for (let i = team.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [team[i], team[j]] = [team[j], team[i]]; }
      const avgT = team.reduce((a, n) => a + tgt[n.id], 0) / team.length || 1;
      const O = Math.max(minOff, Math.round(B * days / avgT) - B);
      const C = B + O, phase = Math.floor(R() * C);
      // pair nurses on identical offsets when the team exactly matches the minimum ratio (cleaner handovers)
      team.forEach((n, i) => {
        const off = (Math.round(i * C / team.length) + phase) % C;
        for (let d = 0; d < days; d++) if (!grid[n.id][d].lock && ((d - off) % C + C) % C < B) grid[n.id][d] = { s: T };
      });
      // trim surplus: remove block-edge shifts on over-covered days
      for (let guard = 0; guard < 400; guard++) {
        const over = team.filter(n => shifts(n.id) > tgt[n.id]);
        if (!over.length) break;
        let best = null, bs = -1e9;
        for (const n of over) for (let d = 0; d < days; d++) {
          const c = grid[n.id][d]; if (c.lock || c.s !== T) continue;
          const edge = !W(n.id, d - 1) || !W(n.id, d + 1); if (!edge) continue;
          const cnt = count(d, T); if (cnt <= minOf[T]) continue;
          let sc = cnt * 2 + runAt(n.id, d) * 0.5 + R() * 0.3 + (shifts(n.id) - tgt[n.id]);
          if (!W(n.id, d - 1) && !W(n.id, d + 1)) sc += 3; // lone shift — drop first
          if (sc > bs) { bs = sc; best = [n.id, d]; }
        }
        if (!best) break;
        grid[best[0]][best[1]] = { s: 'O' };
      }
      // fill short: extend blocks at edges, lowest-covered days first
      for (let guard = 0; guard < 400; guard++) {
        const under = team.filter(n => shifts(n.id) < tgt[n.id]);
        if (!under.length) break;
        let best = null, bs = -1e9;
        for (const n of under) for (let d = 0; d < days; d++) {
          if (!canAdd(n.id, d, T, mc)) continue;
          const edge = W(n.id, d - 1) || W(n.id, d + 1);
          let sc = -count(d, T) * 2 + (edge ? 3 : 0) + R() * 0.3;
          const ob = offLen(n.id, d, -1), of = offLen(n.id, d, 1);
          if ((d - ob > 0 && ob < minOff) || (d + of < days - 1 && of < minOff)) sc -= 2.5;
          if (sc > bs) { bs = sc; best = [n.id, d]; }
        }
        if (!best) break;
        grid[best[0]][best[1]] = { s: T };
      }
    });

    // coverage repair: same team overtime first (or cross-cover), extending blocks
    for (let d = 0; d < days; d++) for (const T of ['D', 'N']) {
      while (count(d, T) < minOf[T]) {
        const team = nurses.filter(n => n.team === T), other = nurses.filter(n => n.team !== T);
        const pools = cfg.gapFill === 'cross' ? [other, team] : [team, other];
        let pick = null;
        for (const lim of [mc, mc + 1]) {
          for (const pool of pools) {
            const c = pool.filter(n => canAdd(n.id, d, T, lim));
            if (!c.length) continue;
            const under = n => shifts(n.id) < tgt[n.id] ? 1 : 0;
            c.sort((a, b) => (under(b) - under(a)) || (ot[a.id] - ot[b.id]) || ((W(b.id, d - 1) || W(b.id, d + 1)) - (W(a.id, d - 1) || W(a.id, d + 1))) || (R() - 0.5));
            pick = c[0]; break;
          }
          if (pick) break;
        }
        if (!pick) break;
        const isOT = shifts(pick.id) >= tgt[pick.id];
        grid[pick.id][d] = { s: T, ot: isOT, x: pick.team !== T };
        if (isOT) ot[pick.id]++;
      }
    }
    // charge-nurse nudge: swap a non-CN with an off CN teammate where it keeps blocks legal
    if (hasCN) for (let d = 0; d < days; d++) for (const T of ['D', 'N']) {
      const on = nurses.filter(n => grid[n.id][d].s === T);
      if (!on.length || on.some(n => /CN/.test(n.grade || ''))) continue;
      const isCN = n => /CN/.test(n.grade || '');
      const nc = on.filter(n => !grid[n.id][d].lock && !grid[n.id][d].ot);
      let done = false;
      for (const a of nc) { if (done) break;
        for (const c of nurses.filter(n => n.team === T && isCN(n))) { if (done) break;
          // exchange: c takes day d, a takes one of c's days d2 (which keeps another CN)
          for (let d2 = 0; d2 < days && !done; d2++) {
            if (d2 === d || grid[c.id][d2].s !== T || grid[c.id][d2].lock || grid[a.id][d2].s !== 'O' || grid[a.id][d2].lock) continue;
            if (!nurses.some(n => n !== c && isCN(n) && grid[n.id][d2].s === T)) continue;
            const edgeC2 = !W(c.id, d2 - 1) || !W(c.id, d2 + 1);           // c loses a block edge, not a middle
            const adjCd = W(c.id, d - 1) || W(c.id, d + 1);               // c extends a block
            const adjA2 = W(a.id, d2 - 1) || W(a.id, d2 + 1);             // a extends a block
            const edgeAd = !W(a.id, d - 1) || !W(a.id, d + 1);            // a loses an edge
            if (!(edgeC2 && adjCd && adjA2 && edgeAd)) continue;
            const sa = grid[a.id][d], sc2 = grid[c.id][d2];
            grid[a.id][d] = { s: 'O' }; grid[c.id][d2] = { s: 'O' };
            if (canAdd(c.id, d, T, mc) && canAdd(a.id, d2, T, mc)) { grid[c.id][d] = { s: T }; grid[a.id][d2] = { s: T }; done = true; }
            else { grid[a.id][d] = sa; grid[c.id][d2] = sc2; }
          }
        }
      }
    }
    return grid;
  }

  function validate(ward, grid, cfg, wardLocks) {
    const days = daysIn(cfg.year, cfg.month);
    const nurses = ward.nurses.filter(n => n.on && grid[n.id]);
    const issues = [];
    const hasCN = nurses.some(n => /CN/.test(n.grade || ''));
    const minOf = { D: ward.minD, N: ward.minN };
    const stats = {};
    let alone = { D: 0, N: 0 };

    for (let d = 0; d < days; d++) {
      for (const T of ['D', 'N']) {
        const on = nurses.filter(n => grid[n.id][d].s === T);
        if (on.length < minOf[T]) issues.push({ lvl: 'error', d, T, code: 'gap', p: { have: on.length, need: minOf[T] }, text: `${T === 'D' ? 'Day' : 'Night'} shift has ${on.length}/${minOf[T]} nurses` });
        if (on.length === 1) alone[T]++;
        if (hasCN && on.length && !on.some(n => /CN/.test(n.grade || ''))) issues.push({ lvl: 'warn', d, T, code: 'nocn', p: {}, text: `No charge nurse on ${T === 'D' ? 'day' : 'night'} shift` });
      }
    }
    nurses.forEach(n => {
      const row = grid[n.id];
      let D = 0, N = 0, wkn = 0, otShifts = 0, xs = 0, run = 0, maxRun = 0;
      for (let d = 0; d < days; d++) {
        const s = row[d].s;
        if (s === 'D') D++; if (s === 'N') N++;
        if ((s === 'D' || s === 'N') && isWeekend(cfg.year, cfg.month, d)) wkn++;
        if (row[d].ot) otShifts++;
        if ((s === 'D' || s === 'N') && s !== n.team) xs++;
        if (s === 'D' || s === 'N') { run++; maxRun = Math.max(maxRun, run); } else run = 0;
        if (s === 'N' && d + 1 < days && row[d + 1].s === 'D') issues.push({ lvl: 'error', d: d + 1, nurse: n.name, code: 'rest', p: {}, text: `${n.name}: night → day with no rest` });
      }
      const t = targetFor(n, cfg, wardLocks, days);
      const hours = (D + N) * cfg.shiftLen;
      const diff = hours - t.reqHours;
      stats[n.id] = { D, N, hours, diff, wkn, req: t.reqHours, al: t.al, maxRun, xs };
      if (maxRun > cfg.maxConsec) issues.push({ lvl: 'warn', nurse: n.name, code: 'run', p: { n: maxRun, max: cfg.maxConsec }, text: `${n.name}: ${maxRun} shifts in a row (max ${cfg.maxConsec})` });
      if (diff < 0) issues.push({ lvl: 'warn', nurse: n.name, code: 'under', p: { h: hours, by: -diff, req: t.reqHours }, text: `${n.name}: ${hours}h — ${-diff}h under ${t.reqHours}h target` });
      if (diff >= cfg.shiftLen) issues.push({ lvl: 'info', nurse: n.name, code: 'ot', p: { by: diff, h: hours, req: t.reqHours }, text: `${n.name}: overtime ${diff}h (${hours}h vs ${t.reqHours}h)` });
      if (xs) issues.push({ lvl: 'info', nurse: n.name, code: 'cross', p: { n: xs, T: n.team === 'D' ? 'N' : 'D' }, text: `${n.name}: ${xs} cross-cover ${n.team === 'D' ? 'night' : 'day'} shift(s)` });
    });
    if (alone.N) issues.push({ lvl: 'info', code: 'alone', p: { n: alone.N, T: 'N' }, text: `${alone.N} night(s) with a single nurse` });
    if (alone.D) issues.push({ lvl: 'info', code: 'alone', p: { n: alone.D, T: 'D' }, text: `${alone.D} day(s) with a single nurse` });
    return { issues, stats };
  }

  return { generateWard, validate, daysIn, dow, isWeekend, targetFor };
})();

  save:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
};

// ---------- solver glue ----------
function frag(g,cfg){ if(!cfg.block) return 0; const n=days(); let f=0;
  S.wards.forEach(w=>w.nurses.filter(x=>x.on&&g[w.key]&&g[w.key][x.id]).forEach(x=>{ const r=g[w.key][x.id].map(c=>c.s==='D'||c.s==='N'); let i=0; const seg=[];
    while(i<n){ let j=i; while(j<n&&r[j]===r[i]) j++; seg.push([r[i],j-i]); i=j; }
    seg.forEach((sg,ix)=>{ const inner=ix>0&&ix<seg.length-1; if(sg[0]&&sg[1]===1&&inner) f+=2; if(!sg[0]&&inner&&sg[1]<cfg.minOff) f+=cfg.minOff-sg[1]; }); }));
  return f; }
function score(g,cfg=S.cfg){ let e=0,w=0,ot=0; S.wards.forEach(wd=>{ const v=Engine.validate(wd,g[wd.key],cfg,M().locks[wd.key]); v.issues.forEach(i=>{ if(i.lvl==='error')e++; else if(i.lvl==='warn')w++; }); Object.values(v.stats).forEach(s=>{ if(s.diff>=cfg.shiftLen) ot+=s.diff; }); }); return e*1000+w*10+frag(g,cfg)*3+ot/100; }
function build(seed,cfg=S.cfg){ const g={}; S.wards.forEach(wd=>{ g[wd.key]=Engine.generateWard(wd,cfg,M().locks[wd.key],seed); }); return g; }
function findOption(start,cfg=S.cfg){ let best=null,bs=1e9; for(let s=start;s<start+30;s++){ const g=build(s,cfg); const sc=score(g,cfg); if(sc<bs){bs=sc;best={seed:s,g};} if(sc<0.5) break; } return best; }
function blankGrids(){ const m=M(), n=days(), g={}; S.wards.forEach(w=>{ g[w.key]={}; const lk=m.locks[w.key]||{}; w.nurses.filter(x=>x.on).forEach(x=>{ const L0=lk[x.id]||{}; g[w.key][x.id]=Array.from({length:n},(_,d)=>L0[d]?{s:L0[d],lock:true}:{s:'O'}); }); }); return g; }
function solveRest(){ const m=M(); m.mode='auto'; const o=findOption(1); m.options=[o.seed]; m.idx=0; m.grids=o.g; save(); }
function nextOption(){ const m=M(); const last=m.options.length?Math.max(...m.options)+1:1; const o=findOption(last); m.options.push(o.seed); m.idx=m.options.length-1; m.grids=o.g; save(); }
function dropShiftLocks(){ const m=M(); S.wards.forEach(w=>{ const lk=m.locks[w.key]||{}; Object.values(lk).forEach(row=>{ Object.keys(row).forEach(d=>{ if(row[d]==='D'||row[d]==='N') delete row[d]; }); }); }); }
function buildMonth(){ dropShiftLocks(); solveRest(); }
function startBlank(){ dropShiftLocks(); const m=M(); m.mode='manual'; m.options=[]; m.idx=-1; m.grids=blankGrids(); save(); }
function refresh(){ const m=M(); if(m.mode==='manual') m.grids=blankGrids(); else solveRest(); save(); }
function ensure(){ const m=M(); if(!m.grids){ if(m.mode==='manual') m.grids=blankGrids(); else solveRest(); }
  S.wards.forEach(w=>{ const g=m.grids[w.key]||{}; if(w.nurses.some(n=>n.on&&!g[n.id])||Object.keys(g).some(id=>!w.nurses.find(n=>n.id===id&&n.on))) refresh(); }); }
const validateAll = () => { const m=M(), o={}; S.wards.forEach(w=>o[w.key]=Engine.validate(w,m.grids[w.key],S.cfg,m.locks[w.key])); return o; };
const isLockR = c => c.lock && c.s==='O';
function coverage(k){ const w=ward(k), g=M().grids[k], n=days(); let ok=0; for(let d=0;d<n;d++) for(const T of ['D','N']){ const c=w.nurses.filter(x=>x.on&&g[x.id]&&g[x.id][d].s===T).length; if(c>=(T==='D'?w.minD:w.minN)) ok++; } return {ok,total:n*2}; }
function otOf(v){ const Ln=S.cfg.shiftLen; return Object.values(v.stats).reduce((a,s)=>a+Math.max(0,s.hours-Math.ceil(s.req/Ln)*Ln),0)/Ln; }
function issueText(i,lang){ const l=I18N[lang||S.lang]; if(!i.code) return i.text; const T=i.T||(i.p&&i.p.T);
  const p=Object.assign({name:i.nurse||''},i.p||{}); if(T){ p.T=shiftWord(T,lang); p.t=l===I18N.en?p.T.toLowerCase():p.T; } return fmt(l.I[i.code],p); }

function render(){
  ensure();

function wardView(k,v){

  const errs=v.issues.filter(i=>i.lvl==='error').length, warns=v.issues.filter(i=>i.lvl==='warn').length, cov=coverage(k), xs=otOf(v), Ln=S.cfg.shiftLen, base=Math.ceil(S.cfg.targetHours/Ln);

    h+=`<tr class="team"><td class="nm">${T==='D'?l.dayTeam:l.nightTeam}</td><td colspan="${n+4}"></td></tr>`;
    for(const nu of team){ const row=g[nu.id], s=v.stats[nu.id];
      h+=`<tr><td class="nm"><bdi>${esc(nu.name)}</bdi>${nu.grade?`<span class="g">${esc(nu.grade)}</span>`:''}</td>`;
      for(let d=0;d<n;d++){ const c=row[d], we=Engine.isWeekend(y,mo,d), R=isLockR(c);
        const cls=R?'R':c.s, lab=R?(S.lang==='ar'?'ر':'R'):c.s==='O'?'':c.s==='AL'?(S.lang==='ar'?'إ':'AL'):c.s;
        h+=`<td class="c s-${cls} ${c.ot?'ot':''} ${(c.s==='D'||c.s==='N')&&c.s!==nu.team?'x':''} ${c.lock?'lk':''} ${we?'we':''}" data-act="cell" data-w="${k}" data-n="${nu.id}" data-d="${d}" aria-label="${esc(nu.name)} ${d+1}: ${l.sName[R?'R':c.s]}"><span>${lab}</span></td>`; }
      const cl=s.diff<0?'neg':s.diff>=Ln?'big':'pos';
      h+=`<td class="st num">${s.D}</td><td class="st num">${s.N}</td><td class="st h num">${s.hours}</td><td class="st num ${cl}" dir="ltr">${s.diff>0?'+':''}${s.diff}</td></tr>`; }
  }

  for(const T of ['D','N']){ const min=T==='D'?w.minD:w.minN;
    h+=`<tr><td class="nm">${T==='D'?l.onD:l.onN}</td>`;
    for(let d=0;d<n;d++){ const c=w.nurses.filter(x=>x.on&&g[x.id]&&g[x.id][d].s===T).length; h+=`<td class="num ${c<min?'low':''}">${c}</td>`; }

  </section>`;
  return h;
}

function breakStats(g,cfg){
  const n=days(); let offs=[], runs=[], ot=0, prob=0;
  S.wards.forEach(w=>{ const v=Engine.validate(w,g[w.key],cfg,M().locks[w.key]); prob+=v.issues.filter(i=>i.lvl!=='info').length; ot+=otOf(v);
    w.nurses.filter(x=>x.on&&g[w.key][x.id]).forEach(x=>{ const r=g[w.key][x.id].map(c=>c.s==='D'||c.s==='N'); let i=0; const sg=[];
      while(i<n){ let j=i; while(j<n&&r[j]===r[i]) j++; sg.push([r[i],j-i]); i=j; }
      sg.forEach((s,ix)=>{ if(s[0]) runs.push(s[1]); else if(ix>0&&ix<sg.length-1) offs.push(s[1]); }); }); });
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
  return { avgOff:avg(offs), minOff:offs.length?Math.min(...offs):0, maxRun:runs.length?Math.max(...runs):0, ot, prob };
}

function wardsInScope(){ return EX.scope==='both'?['men','women']:[EX.scope]; }
function fileBase(){ return `roster-${S.cfg.year}-${String(S.cfg.month+1).padStart(2,'0')}`; }
async function prepareExport(){

  const acts=$('#exActs'); const out=$('#exOut');

function doShare(){
  if(!exReady||!exReady.files) return; const f=exReady.files;
  if(navigator.canShare&&navigator.canShare({files:f})){ navigator.share({files:f,title:f[0].name}).catch(e=>{ if(e&&e.name!=='AbortError') doSave(); }); }
  else { doSave(); toast(L().shareFail); }
}
function doSave(){ if(!exReady||!exReady.files) return; exReady.files.forEach((f,i)=>setTimeout(()=>download(f,f.name),i*400)); }

function buildMessage(){
  const lang=EX.lang, l=I18N[lang], m=M(), y=S.cfg.year, mo=S.cfg.month, n=days(), ds=S.cfg.dayStart, t=new Date();
  let list=[];
  if(EX.when==='sel') list=[S.selDay||0];
  else if(EX.when==='today') list=[t.getDate()-1];
  else if(EX.when==='tomorrow') list=[Math.min(n-1,t.getDate())];
  else { const s0=(t.getFullYear()===y&&t.getMonth()===mo)?t.getDate()-1:(S.selDay||0); for(let i=0;i<7&&s0+i<n;i++) list.push(s0+i); }
  const week=list.length>1, sep=lang==='ar'?'، ':', ';
  const nm=x=>x.name+(x.grade?` (${x.grade})`:'');
  const out=[];
  if(S.org.facility) out.push(`*${S.org.facility}*`);
  for(const d of list){
    out.push(`*${l.wdLong[Engine.dow(y,mo,d)]} ${d+1} ${l.months[mo]} ${y}*`);
    for(const k of wardsInScope()){ const w=ward(k), g=m.grids[k];
      const on=T=>w.nurses.filter(x=>x.on&&g[x.id]&&g[x.id][d].s===T);
      if(wardsInScope().length>1||!week) out.push(`_${l[k]}_`);
      out.push(`${fmt(l.msgDayLine,{d:rng(ds,ds+12)})}: ${on('D').map(nm).join(sep)||l.nobody}`);
      out.push(`${fmt(l.msgNightLine,{n:rng(ds+12,ds)})}: ${on('N').map(nm).join(sep)||l.nobody}`);
      const al=w.nurses.filter(x=>x.on&&g[x.id]&&g[x.id][d].s==='AL'); if(al.length&&!week) out.push(`${l.onLeave}: ${al.map(x=>x.name).join(sep)}`);
    }
    out.push('');
  }

}

function makePDF(canvases){
  const enc=new TextEncoder(), parts=[], offs=[]; let len=0;
  const push=b=>{ if(typeof b==='string') b=enc.encode(b); parts.push(b); len+=b.length; };
  const obj=(id,fn)=>{ offs[id]=len; push(`${id} 0 obj\n`); fn(); push('\nendobj\n'); };
  push('%PDF-1.4\n'); push(new Uint8Array([37,226,227,207,211,10]));
  const n=canvases.length, kids=canvases.map((_,i)=>`${3+i*3} 0 R`).join(' ');
  obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>push(`<< /Type /Pages /Kids [${kids}] /Count ${n} >>`));
  canvases.forEach((cv,i)=>{ const pid=3+i*3, cid=pid+1, iid=pid+2;
    const b64=cv.toDataURL('image/jpeg',0.93).split(',')[1]; const bin=atob(b64); const jpg=new Uint8Array(bin.length); for(let j=0;j<bin.length;j++) jpg[j]=bin.charCodeAt(j);
    const content=`q 842 0 0 595 0 0 cm /Im0 Do Q`;
    obj(pid,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 842 595] /Resources << /XObject << /Im0 ${iid} 0 R >> >> /Contents ${cid} 0 R >>`));
    obj(cid,()=>{ push(`<< /Length ${content.length} >>\nstream\n`); push(content); push('\nendstream'); });
    obj(iid,()=>{ push(`<< /Type /XObject /Subtype /Image /Width ${cv.width} /Height ${cv.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`); push(jpg); push('\nendstream'); });
  });
  const total=3+n*3, xref=len;
  let xr=`xref\n0 ${total}\n0000000000 65535 f \n`; for(let i=1;i<total;i++) xr+=`${String(offs[i]).padStart(10,'0')} 00000 n \n`;
  push(xr); push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts,{type:'application/pdf'});
}

// ---------- toast ----------
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),2200); }

// ---------- events ----------
let resetArmed=0;
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t||t.closest('#sheet')) return;
  const a=t.dataset.act, m=M(), w=t.dataset.w&&ward(t.dataset.w), nu=w&&w.nurses.find(x=>x.id===t.dataset.n), dv=+t.dataset.dv||0, val=t.dataset.val;
  switch(true){
    case a==='view': S.view=t.dataset.v; save(); render(); window.scrollTo({top:0}); return;
    case a==='settings': S.view='settings'; save(); render(); window.scrollTo({top:0}); return;
    case a==='lang': S.lang=S.lang==='en'?'ar':'en'; EX.lang=null; save(); render(); return;
    case a==='mPrev'||a==='mNext': { let mo=S.cfg.month+(a==='mNext'?1:-1), y=S.cfg.year; if(mo<0){mo=11;y--;} if(mo>11){mo=0;y++;} S.cfg.month=mo; S.cfg.year=y; S.selDay=null; save(); render(); return; }
    case a==='cell': cellSheet(t.dataset.w,t.dataset.n,+t.dataset.d); return;
    case a==='selDay': S.selDay=+t.dataset.d; save(); render(); return;
    case a==='patterns': patternSheet(); return;
    case a==='solve': solveSheet(); return;
    case a==='doRest': solveRest(); render(); return;
    case a==='export': exportSheet({fmt:EX.fmt==='msg'?'pdf':EX.fmt, scope:(S.view==='men'||S.view==='women')?S.view:'both'}); return;
    case a==='shareDay': exportSheet({fmt:'msg',when:'sel',scope:'both'}); return;
    case a==='optPrev': if(m.idx>0){ m.idx--; m.grids=build(m.options[m.idx]); save(); render(); } return;
    case a==='optNext': if(m.idx<m.options.length-1){ m.idx++; m.grids=build(m.options[m.idx]); } else nextOption(); save(); render(); return;
    case a==='tgt': S.cfg.targetHours=Math.max(12,Math.min(240,S.cfg.targetHours+dv*4)); refresh(); break;
    case a==='start': S.cfg.dayStart=+val; break;
    case a==='gap': S.cfg.gapFill=val; refresh(); break;
    case a==='alc': S.cfg.alCredit=+val; refresh(); break;
    case a.startsWith('minD:')||a.startsWith('minN:'): { const [f,k]=a.split(':'); const wd=ward(k); wd[f]=Math.max(0,Math.min(6,wd[f]+dv)); refresh(); break; }
    case a.startsWith('team:'): { const [,k,id]=a.split(':'); const n0=ward(k).nurses.find(x=>x.id===id); n0.team=val; refresh(); break; }
    case a==='del': w.nurses=w.nurses.filter(x=>x!==nu); refresh(); break;
    case a==='add': w.nurses.push({id:'n'+Date.now().toString(36),name:L().newNurse,grade:'',team:'D',on:true}); refresh(); break;
    case a==='backup': download(new Blob([JSON.stringify(S)],{type:'application/json'}),`${fileBase()}-backup.json`); toast(L().saved); return;
    case a==='reset': if(Date.now()-resetArmed<4000){ const lang=S.lang; S={cfg:DEFAULT_CFG(),wards:DEFAULT_WARDS(),months:{},view:'settings',selDay:null,lang,org:DEFAULT_ORG()}; save(); render(); } else { resetArmed=Date.now(); t.textContent=L().resetAgain; } return;
    default: return;
  }
  save(); render();
});
document.addEventListener('input',e=>{ const t=e.target;
  if(t.dataset.org){ S.org[t.dataset.org]=t.value; save(); if(t.dataset.org==='facility') $('#brandSub').textContent=t.value||L().unnamed; return; }
  if(t.dataset.chg==='name'){ const nu=ward(t.dataset.w).nurses.find(x=>x.id===t.dataset.n); nu.name=t.value; save(); }
});
document.addEventListener('change',e=>{ const t=e.target, c=t.dataset.chg; if(!c) return;
  if(c==='restore'){ const f=t.files&&t.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const o=JSON.parse(r.result); if(!o.cfg||!o.wards) throw 0; const lang=S.lang; S=migrate(o); if(!o.lang) S.lang=lang; save(); render(); toast(L().restored); }catch(err){ toast(L().badFile); } }; r.readAsText(f); return; }
  const nu=ward(t.dataset.w).nurses.find(x=>x.id===t.dataset.n);
  if(c==='on'){ nu.on=t.checked; refresh(); }
  if(c==='grade'){ nu.grade=t.value; }
  if(c==='name'){ nu.name=t.value.trim()||nu.name; }
  save(); render();
});

render();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();

</script>
